# CodeAtlas — one-command local stack
# Usage: docker compose up --build
#   - db       → PostgreSQL 16 (5433:5432 on host, db:5432 inside the network)
#   - backend  → FastAPI on http://localhost:8000 (auto-migrates + seeds on boot)
#   - frontend → Next.js on http://localhost:3000
#
# Nothing else is required. The backend self-heals a stale checkout
# (lifespan runs `alembic upgrade head` + seed_problems), so the fingerprint /
# retention_states 500s go away without a manual step. Rebuild after pulling
# new migrations: docker compose up --build
#
# Host-only dev (without Docker) still works:
#   backend:  uvicorn app.main:app --reload   (from backend/)
#   frontend: npm run dev                     (from frontend/)
# but `docker compose up` is now the single entry point.

services:
  db:
    image: postgres:16-alpine
    container_name: codeatlas-db
    environment:
      POSTGRES_USER: codeatlas
      POSTGRES_PASSWORD: codeatlas
      POSTGRES_DB: codeatlas
    ports:
      - "5433:5432"
    volumes:
      - codeatlas-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeatlas"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codeatlas-backend
    restart: unless-stopped
    environment:
      # Inside the compose network the db host is `db`, not localhost.
      # This overrides the host-default in backend/app/core/config.py
      # (postgresql+psycopg://codeatlas:codeatlas@localhost:5433/codeatlas).
      DATABASE_URL: postgresql+psycopg://codeatlas:codeatlas@db:5432/codeatlas
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      DOCKER_IMAGE: python:3.12-alpine
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Required for Run/Submit: the backend spawns sibling containers via the
      # host Docker engine. Without this mount execution returns 503; everything
      # else (auth, curriculum, retention, generator, etc.) still works.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    container_name: codeatlas-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  codeatlas-pgdata:
